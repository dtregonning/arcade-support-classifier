[project]
name = "support-automation"
version = "0.1.0"
description = "Support engineering automation demo: validation, enrichment, routing, and recommendations for support tickets, exposed as MCP tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "arcade-mcp-server>=1.17.0,<2.0.0",
    "arcadepy>=1.8.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "anthropic>=0.40.0,<1.0.0",
]

[project.scripts]
support-demo = "support_automation.cli:main"
support-portal = "support_automation.webapp.app:main"
support-mcp = "support_automation.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_automation"]

# config/ lives at the repo root (see CLAUDE.md's repo layout / support_automation._config_paths)
# so it stays trivially editable without touching src/, but it must still ship inside the wheel
# for deployed installs (e.g. Arcade) where the repo root doesn't exist on disk.
[tool.hatch.build.targets.wheel.force-include]
"config" = "support_automation/config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
