[project]
name = "support-automation"
version = "0.1.0"
description = "Support engineering automation demo: validation, enrichment, routing, and recommendations for support tickets, exposed as MCP tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
support-demo = "support_automation.cli:main"

[project.optional-dependencies]
mcp = [
    "arcade-mcp>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_automation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
